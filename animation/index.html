<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Void Bloom — Pure CSS</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet"/>
</head>
<body>
 
  <!-- Background layers -->
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <div class="grid"></div>
    <div class="sweep"></div>
    <div class="scanlines"></div>
  </div>
 
  <!-- 30 CSS-only floating particles -->
  <div class="particles">
    <div class="p p1"></div><div class="p p2"></div><div class="p p3"></div>
    <div class="p p4"></div><div class="p p5"></div><div class="p p6"></div>
    <div class="p p7"></div><div class="p p8"></div><div class="p p9"></div>
    <div class="p p10"></div><div class="p p11"></div><div class="p p12"></div>
    <div class="p p13"></div><div class="p p14"></div><div class="p p15"></div>
    <div class="p p16"></div><div class="p p17"></div><div class="p p18"></div>
    <div class="p p19"></div><div class="p p20"></div><div class="p p21"></div>
    <div class="p p22"></div><div class="p p23"></div><div class="p p24"></div>
    <div class="p p25"></div><div class="p p26"></div><div class="p p27"></div>
    <div class="p p28"></div><div class="p p29"></div><div class="p p30"></div>
  </div>
 
  <!-- Stage -->
  <main class="stage">
 
    <!-- Ring system -->
    <div class="ring-system">
      <div class="ring r-outer"></div>
      <div class="ring r-mid"></div>
      <div class="ring r-inner"></div>
      <div class="ring r-tiny"></div>
      <div class="core">
        <div class="core-dot"></div>
        <div class="core-ring cr1"></div>
        <div class="core-ring cr2"></div>
      </div>
    </div>
 
    <!-- Text -->
    <div class="text-block">
      <div class="label">✦ SYSTEM ACTIVE ✦</div>
      <h1 class="headline">
        <span class="line l1">VOID</span>
        <span class="line l2">BLOOM</span>
      </h1>
      <p class="sub">Spatial resonance · v2.4.1</p>
      <div class="glitch-bars">
        <span class="gb gb1"></span>
        <span class="gb gb2"></span>
        <span class="gb gb3"></span>
        <span class="gb gb4"></span>
        <span class="gb gb5"></span>
        <span class="gb gb6"></span>
      </div>
    </div>
 
    <!-- HUD strip -->
    <div class="hud">
      <div class="hud-item">
        <span class="hud-lbl">FREQ</span>
        <div class="freq-wrap">
          <span class="fr fr1">044.7</span>
          <span class="fr fr2">091.2</span>
          <span class="fr fr3">037.5</span>
          <span class="fr fr4">076.3</span>
        </div>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-item">
        <span class="hud-lbl">NODE</span>
        <span class="node-blink">●</span>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-item">
        <span class="hud-lbl">SYNC</span>
        <div class="eq">
          <div class="eq-b b1"></div>
          <div class="eq-b b2"></div> 
          <div class="eq-b b3"></div>
          <div class="eq-b b4"></div>
          <div class="eq-b b5"></div>
          <div class="eq-b b6"></div>
          <div class="eq-b b7"></div>
        </div>
      </div>
    </div>
 
  </main>
 
</body>
</html>

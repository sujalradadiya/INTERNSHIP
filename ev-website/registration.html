<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Registration Form</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
      padding:40px 0;
    }

    .main{
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* ================= LOADER ================= */

    .cube-loader {
      position: relative;
      width: 75px;
      height: 75px;
      transform-style: preserve-3d;
      transform: rotateX(-30deg);
      animation: animate 4s linear infinite;
      margin-bottom:40px;
    }

    @keyframes animate {
      0% {
        transform: rotateX(-30deg) rotateY(0);
      }

      100% {
        transform: rotateX(-30deg) rotateY(360deg);
      }
    }

    .cube-loader .cube-wrapper {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .cube-loader .cube-wrapper .cube-span {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotateY(calc(90deg * var(--i))) translateZ(37.5px);
      background: linear-gradient(to bottom,#2c3e50,#4ca1af);
    }

    .cube-top {
      position: absolute;
      width: 75px;
      height: 75px;
      background: #2c3e50;
      transform: rotateX(90deg) translateZ(37.5px);
      transform-style: preserve-3d;
    }

    .cube-top::before {
      content: '';
      position: absolute;
      width: 75px;
      height: 75px;
      background: #4ca1af;
      transform: translateZ(-90px);
      filter: blur(10px);

      box-shadow:
        0 0 10px #4ca1af,
        0 0 20px #4ca1af,
        0 0 40px #4ca1af,
        0 0 60px #4ca1af;
    }

    /* ================= FORM ================= */

    .container{
      width:400px;
      background:#ffffff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .container h2{
      text-align:center;
      margin-bottom:25px;
      color:#243b55;
      font-size:28px;
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#333;
    }

    .input-box input,
    .input-box textarea{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      transition:0.3s;
      font-size:15px;
    }

    .input-box input:focus,
    .input-box textarea:focus{
      border-color:#243b55;
      box-shadow:0 0 8px rgba(36,59,85,0.3);
    }

    .gender{
      display:flex;
      gap:20px;
      margin-top:8px;
    }

    .gender label{
      font-weight:normal;
      color:#444;
    }

    .pdf-upload{
      background:#f4f4f4;
      padding:10px;
      border-radius:10px;
      border:1px dashed #999;
    }

    button{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg,#141e30,#243b55);
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.9;
    }

    /* ================= TOASTER ================= */

    .toast{
      position:fixed;
      top:20px;
      right:20px;
      background:#0d024c2a;
      color:white;
      padding:15px 25px;
      border-radius:10px;
      font-weight:bold;
      box-shadow:0 5px 15px rgba(0,0,0,0.3);

      opacity:0;
      transform:translateX(100px);
      transition:0.5s;
    }

    .toast.show{
      opacity:1;
      transform:translateX(0);
    }

    @media(max-width:450px){

      .container{
        width:90%;
      }

    }

  </style>
  <script>
    const submithandler=(data)=>{
        console.log("=== User Registration Data ===");
        console.log(data);
    }
  </script>
</head>
<body>

  <!-- Toast Message -->

  <div id="toast" class="toast">
    Registration Completed Successfully....!
  </div>

  <div class="main">

    <!-- Loader -->

    <div class="cube-loader">

      <div class="cube-top"></div>

      <div class="cube-wrapper">

        <span style="--i:0" class="cube-span"></span>
        <span style="--i:1" class="cube-span"></span>
        <span style="--i:2" class="cube-span"></span>
        <span style="--i:3" class="cube-span"></span>

      </div>

    </div>

    <!-- Registration Form -->

    <div class="container">

      <h2>Registration Form</h2>

      <form id="registerForm">

        <div class="input-box">
          <label>First Name</label>
          <input type="text" name="firstName" placeholder="Enter first name" required>
        </div>

        <div class="input-box">
          <label>Last Name</label>
          <input type="text" name="lastName" placeholder="Enter last name" required>
        </div>

        <div class="input-box">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter email" required>
        </div>

        <div class="input-box">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="Enter 10-digit phone number" pattern="[0-9]{10}" title="Please enter a 10-digit phone number" required>
        </div>

        <div class="input-box">
          <label>Gender</label>

          <div class="gender">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
        </div>

        <div class="input-box">
          <label>Address</label>
          <textarea name="address" rows="4" placeholder="Enter address"></textarea>
        </div>

        <div class="input-box">
          <label>Upload PDF</label>

          <div class="pdf-upload">
            <input type="file" name="pdfFile" accept=".pdf">
          </div>
        </div>

        <button type="submit">Register</button>

      </form>

    </div>

  </div>

  <!-- JavaScript -->

  <script>

    const form = document.getElementById("registerForm");
    const toast = document.getElementById("toast");

    form.addEventListener("submit", function(e){
      e.preventDefault();

      // Collect data from the form
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const fileField = data.pdfFile;

      // Helper function to save and redirect
      const saveAndRedirect = (finalData) => {
        // Save the data to sessionStorage so it survives the redirect!
        sessionStorage.setItem('userData', JSON.stringify(finalData));

        // Call the submithandler function you made
        submithandler(finalData);

        // Mark user as registered for this session
        sessionStorage.setItem('isRegistered', 'true');

        // Show Toast
        toast.classList.add("show");

        // Hide Toast after 2 seconds and redirect to the main website
        setTimeout(() => {
          toast.classList.remove("show");
          window.location.href = 'index.html';
        }, 2000);
      };

      // Check if there is a file and convert it to Base64
      if (fileField && fileField.size > 0) {
        const reader = new FileReader();
        reader.onload = function(event) {
          data.pdfFile = event.target.result; // base64 string
          saveAndRedirect(data);
        };
        reader.readAsDataURL(fileField);
      } else {
        // If no file was uploaded, save directly
        saveAndRedirect(data);
      }
    });

  </script>

</body>
</html>
